name: daily_morning

# Two-layer trigger architecture (as of 2026-08-03):
#   Plan A (primary): external cron-job.org POSTs workflow_dispatch at 00:03
#     UTC Mon-Fri. ~99.9% reliability. This is what actually lands the report
#     on time.
#   Plan B (fallback): the GH-native cron below at 00:07 UTC Mon-Fri. GH cron
#     has ~90% drop rate + occasional multi-hour backlogs for this repo, so
#     it's kept only to cover the rare cron-job.org outage day (~1/year).
#
# Idempotency guard: whichever layer fires first sends the report; subsequent
# fires check the DB, see "already sent today," and exit before the expensive
# Python setup. Safe to be triggered by cron + workflow_dispatch + external
# POST in any order.
#
# History: shifted 3h earlier 2026-07-31 (was 03:07 UTC target). Redesigned
# 2026-08-03 after a full-day GH backlog delayed all 19 heartbeat attempts to
# 12:41 UTC (15:41 IST); heartbeat retired in favor of external primary. See
# memory project_gh_actions_cron_offpeak.md for full incident history.
on:
  schedule:
    - cron: '7 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# Serialize writes to the data-store branch. All workflows that force-push there
# share this group so no run overwrites another's DB snapshot mid-flight (the
# race that made silent failures look identical to successful churn). Queue,
# don't cancel — every push carries a legitimate row nobody else is writing.
concurrency:
  group: data-store-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cheap steps FIRST so late/duplicate fires exit before Python setup.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Prepare data dirs
        run: mkdir -p data data/backups data/cache
      - name: Restore DB from data-store branch
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-store >/dev/null 2>&1; then
            git fetch origin data-store:data-store --depth=1
            git show data-store:data/finance_reporter.db > data/finance_reporter.db || echo "no DB blob yet"
          else
            echo "data-store branch not yet created — bootstrap run"
          fi
      - name: Check if daily_morning already sent today
        id: check
        run: |
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB — treating as MISSED"
            echo "missed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(sqlite3 data/finance_reporter.db \
            "SELECT COUNT(*) FROM report_sends
             WHERE report_type='daily_morning'
             AND sent_at LIKE '${TODAY}%'
             AND telegram_message_id IS NOT NULL;")
          if [ "$COUNT" -eq 0 ]; then
            echo "daily_morning MISSED today (${TODAY}) — firing"
            echo "missed=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily_morning already sent today (${TODAY}), count=${COUNT} — skipping"
            echo "missed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.missed == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        if: steps.check.outputs.missed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily_morning
        if: steps.check.outputs.missed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          DRY_RUN: 'false'
          KILL_SWITCH_DAILY_MORNING: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -m src.run_report daily_morning
      - name: Guard DB before push (refuse empty/regressing state)
        if: steps.check.outputs.missed == 'true'
        run: bash scripts/guard_db_push.sh
      - name: Commit DB to data-store branch
        if: steps.check.outputs.missed == 'true'
        run: |
          set -e
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB file to commit"
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cp data/finance_reporter.db "$TMPDIR/finance_reporter.db"
          cd "$TMPDIR"
          git init -q -b data-store
          git config user.email "bot@finance-reporter.local"
          git config user.name  "finance-reporter-bot"
          mkdir data
          mv finance_reporter.db data/
          git add data/finance_reporter.db
          git commit -q -m "DB snapshot: daily_morning $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin data-store
