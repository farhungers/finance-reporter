name: daily_morning

# ~06:00 IST Mon-Fri (03:07 UTC). Operator-requested shift (2026-07-30) from
# 07:00 IST target: bake in headroom for the 1-2h GH Actions cron drift we've
# been seeing so friend still gets the briefing at his old target time even on
# bad-drift days. Off-peak minute per prior tuning. Polling heartbeat covers
# 03:13-06:43 UTC as fallback.
on:
  schedule:
    - cron: '7 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare data dirs
        run: mkdir -p data data/backups data/cache
      - name: Restore DB from data-store branch
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-store >/dev/null 2>&1; then
            git fetch origin data-store:data-store --depth=1
            git show data-store:data/finance_reporter.db > data/finance_reporter.db || echo "no DB blob yet"
          else
            echo "data-store branch not yet created — bootstrap run"
          fi
      - name: Run daily_morning
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          DRY_RUN: 'false'
          KILL_SWITCH_DAILY_MORNING: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -m src.run_report daily_morning
      - name: Commit DB to data-store branch
        if: always()
        run: |
          set -e
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB file to commit"
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cp data/finance_reporter.db "$TMPDIR/finance_reporter.db"
          cd "$TMPDIR"
          git init -q -b data-store
          git config user.email "bot@finance-reporter.local"
          git config user.name  "finance-reporter-bot"
          mkdir data
          mv finance_reporter.db data/
          git add data/finance_reporter.db
          git commit -q -m "DB snapshot: daily_morning $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin data-store
