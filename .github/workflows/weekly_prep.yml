name: weekly_prep

# 16:00 IST Sunday = 13:00 UTC Sunday (§B.4 locked).
on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/_run_report.yml
    with:
      report_type: weekly_prep
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
