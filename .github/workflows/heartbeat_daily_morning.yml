name: heartbeat_daily_morning

# Polling fallback: every 10 min from 00:00 to 08:50 UTC Mon-Fri
# = 54 attempts spanning 03:00-11:50 IST. Combined with 00:07 UTC primary
# gives 55 attempts across a 9h window. Goal: at-least-one lands ≤ 12:00
# IST even when GH backlogs an entire wave (~90% cron drop AND multi-hour
# queue holds — see 2026-08-03 incident where all 19 attempts of the prior
# 3h window fired together at 12:41 UTC).
#
# Cost discipline: idle attempts fast-exit via a system-sqlite3 check BEFORE
# the expensive setup-python + pip install steps. Idle run ~5-10s, real run
# ~90s. Budget: 54 attempts × 5 days × ~10s = ~45 min/week idle + ~2 min/week
# real = ~190 min/month. Fits in the ~2000 min/month free tier alongside
# other workflows.
#
# Widened 2026-08-03 from 0-2 UTC to 0-8 UTC after a full-day GH backlog
# delayed the entire 3h-window wave to 12:41 UTC (15:41 IST). Wider window
# gives more independent schedule slots to survive multi-hour backlogs.
# See daily_morning.yml + memory project_gh_actions_cron_offpeak.md for full
# incident history.
on:
  schedule:
    - cron: '*/10 0-8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_and_maybe_run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cheap steps FIRST so idle attempts exit before the expensive Python setup.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Prepare data dirs
        run: mkdir -p data data/backups data/cache
      - name: Restore DB from data-store branch
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-store >/dev/null 2>&1; then
            git fetch origin data-store:data-store --depth=1
            git show data-store:data/finance_reporter.db > data/finance_reporter.db || echo "no DB blob yet"
          else
            echo "data-store branch not yet created — bootstrap run"
          fi
      - name: Check if daily_morning already sent today
        id: check
        run: |
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB — treating as MISSED"
            echo "missed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(sqlite3 data/finance_reporter.db \
            "SELECT COUNT(*) FROM report_sends
             WHERE report_type='daily_morning'
             AND sent_at LIKE '${TODAY}%'
             AND telegram_message_id IS NOT NULL;")
          if [ "$COUNT" -eq 0 ]; then
            echo "daily_morning MISSED today (${TODAY}) — firing fallback"
            echo "missed=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily_morning already sent today (${TODAY}), count=${COUNT} — skipping"
            echo "missed=false" >> "$GITHUB_OUTPUT"
          fi
      # Expensive steps ONLY when we need to actually run the report.
      - uses: actions/setup-python@v7
        if: steps.check.outputs.missed == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        if: steps.check.outputs.missed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily_morning (fallback)
        if: steps.check.outputs.missed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          DRY_RUN: 'false'
          KILL_SWITCH_DAILY_MORNING: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -m src.run_report daily_morning
      - name: Commit DB to data-store branch
        if: steps.check.outputs.missed == 'true'
        run: |
          set -e
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB file to commit"
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cp data/finance_reporter.db "$TMPDIR/finance_reporter.db"
          cd "$TMPDIR"
          git init -q -b data-store
          git config user.email "bot@finance-reporter.local"
          git config user.name  "finance-reporter-bot"
          mkdir data
          mv finance_reporter.db data/
          git add data/finance_reporter.db
          git commit -q -m "DB snapshot: heartbeat_daily_morning $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin data-store
