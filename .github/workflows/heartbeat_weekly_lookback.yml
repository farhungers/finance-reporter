name: heartbeat_weekly_lookback

# Polling fallback for the Saturday weekly_lookback report.
# Every 10 min from 13:00 to 15:50 UTC Saturday = 18 attempts spanning
# 16:00-18:50 IST. Combined with 13:07 UTC primary gives 19 attempts across
# a 3h window. Under the observed ~90% GH cron drop rate, 0.9^19 = 13%
# all-miss probability — ~once/month tolerable miss.
#
# weekly_lookback is the accuracy loop's public face — silent misses erode
# the calibration discipline. Added 2026-07-31 alongside heartbeat_daily_wrap
# hardening (previously weekly reports had no heartbeat coverage at all).
#
# Cost discipline: idle attempts fast-exit via sqlite3 check BEFORE the
# expensive setup-python + pip install steps. Idle ~10s, real ~90s.
on:
  schedule:
    - cron: '*/10 13-15 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_and_maybe_run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Prepare data dirs
        run: mkdir -p data data/backups data/cache
      - name: Restore DB from data-store branch
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-store >/dev/null 2>&1; then
            git fetch origin data-store:data-store --depth=1
            git show data-store:data/finance_reporter.db > data/finance_reporter.db || echo "no DB blob yet"
          else
            echo "data-store branch not yet created — bootstrap run"
          fi
      - name: Check if weekly_lookback already sent today
        id: check
        run: |
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB — treating as MISSED"
            echo "missed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(sqlite3 data/finance_reporter.db \
            "SELECT COUNT(*) FROM report_sends
             WHERE report_type='weekly_lookback'
             AND sent_at LIKE '${TODAY}%'
             AND telegram_message_id IS NOT NULL;")
          if [ "$COUNT" -eq 0 ]; then
            echo "weekly_lookback MISSED today (${TODAY}) — firing fallback"
            echo "missed=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly_lookback already sent today (${TODAY}), count=${COUNT} — skipping"
            echo "missed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.missed == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        if: steps.check.outputs.missed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run weekly_lookback (fallback)
        if: steps.check.outputs.missed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          DRY_RUN: 'false'
          KILL_SWITCH_WEEKLY_LOOKBACK: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -m src.run_report weekly_lookback
      - name: Commit DB to data-store branch
        if: steps.check.outputs.missed == 'true'
        run: |
          set -e
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB file to commit"
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cp data/finance_reporter.db "$TMPDIR/finance_reporter.db"
          cd "$TMPDIR"
          git init -q -b data-store
          git config user.email "bot@finance-reporter.local"
          git config user.name  "finance-reporter-bot"
          mkdir data
          mv finance_reporter.db data/
          git add data/finance_reporter.db
          git commit -q -m "DB snapshot: heartbeat_weekly_lookback $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin data-store
