name: daily_backup

# 03:30 UTC daily — 30 min before daily_morning (§E.24 backup discipline).
# Backup does NOT need Telegram creds but the reusable workflow requires them;
# `report_type: backup` in run_report.py branches around Telegram send.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/_run_report.yml
    with:
      report_type: backup
      commit_db: false   # backup snapshots don't need DB writeback
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
