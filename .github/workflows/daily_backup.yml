name: daily_backup

# 03:37 UTC daily — 30 min before daily_morning (§E.24 backup discipline).
# Off-peak minute per §B.4 (top-of-hour crons get deferred/dropped on GH Actions).
# Also mirrors the current DB snapshot to farhungers/finance-reporter-backups.
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare data dirs
        run: mkdir -p data data/backups data/cache
      - name: Restore DB from data-store branch
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-store >/dev/null 2>&1; then
            git fetch origin data-store:data-store --depth=1
            git show data-store:data/finance_reporter.db > data/finance_reporter.db || echo "no DB blob yet"
          else
            echo "data-store branch not yet created — bootstrap run"
          fi
      - name: Run backup (SQLite .backup + prune old)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python -m src.run_report backup
      - name: Mirror to backups repo
        env:
          BACKUP_REPO_PAT: ${{ secrets.BACKUP_REPO_PAT }}
        run: |
          set -e
          if [ ! -f data/finance_reporter.db ]; then
            echo "no DB file to mirror"
            exit 0
          fi
          if [ -z "$BACKUP_REPO_PAT" ]; then
            echo "BACKUP_REPO_PAT secret not set — skipping mirror to backups repo"
            exit 0
          fi
          TMPDIR=$(mktemp -d)
          cp data/finance_reporter.db "$TMPDIR/finance_reporter.db"
          # Include recent backup files if any
          if [ -d data/backups ]; then
            cp -r data/backups "$TMPDIR/backups"
          fi
          cd "$TMPDIR"
          git init -q -b main
          git config user.email "bot@finance-reporter.local"
          git config user.name  "finance-reporter-bot"
          mkdir -p data
          mv finance_reporter.db data/
          if [ -d backups ]; then
            mv backups data/
          fi
          git add data/
          git commit -q -m "backup snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:$BACKUP_REPO_PAT@github.com/farhungers/finance-reporter-backups.git"
          git push -f origin main
