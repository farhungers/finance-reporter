name: daily_wrap

# 19:00 IST Mon-Fri = 16:00 UTC Mon-Fri (§B.4 locked).
on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/_run_report.yml
    with:
      report_type: daily_wrap
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
